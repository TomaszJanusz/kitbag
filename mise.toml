[tools]
"core:go" = "1.27.3"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:mvdan/gofumpt" = "0.12.0"
"aqua:goreleaser/goreleaser" = "2.19.0"
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:sigstore/cosign" = "3.1.4"
"aqua:anchore/syft" = "1.55.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:slsa-framework/slsa-verifier" = "2.7.1"
"aqua:mvdan/sh" = "3.14.1"
"aqua:crate-ci/typos" = "1.51.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:google/osv-scanner" = "2.7.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.31.1"
"go:github.com/daixiang0/gci" = "0.14.0"
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:golang.org/x/exp/cmd/apidiff" = "v0.0.0-20261014143641-f0251eb4aa3e" # Public module version; gitleaks:allow
"go:github.com/vladopajic/go-test-coverage/v2" = "2.20.1"

[env]
GOTOOLCHAIN = "local"
GOMAXPROCS = "2"
GOFLAGS = "-p=2"

[tasks.format]
description = "Format all Go sources"
run = "bash scripts/quality.sh format"

[tasks."format:check"]
description = "Check all Go source formatting without writing"
run = "bash scripts/quality.sh format-check"

[tasks.lint]
description = "Validate configuration and lint all packages"
run = "golangci-lint config verify && golangci-lint run ./..."

[tasks.check]
description = "Run the complete local quality gate (read-only)"
run = [
  "bash scripts/quality.sh format-check",
  "bash scripts/coverage-test.sh",
  "bash scripts/quality-test.sh",
  "golangci-lint config verify",
  "golangci-lint run ./...",
  "go vet ./...",
  "go test -race -shuffle=on -count=1 ./...",
  "go test ./pkg/manifest -run=^$ -fuzz=^FuzzParse$ -fuzztime=2s -parallel=2",
  "bash scripts/manifest-api.sh",
  "govulncheck ./...",
  "typos",
]

[tasks."hooks:install"]
description = "Install the repository's pre-commit hook"
run = "lefthook install"

[tasks.coverage]
description = "Report per-package coverage and enforce group floors"
run = "bash scripts/coverage.sh"

[tasks."check:modules"]
description = "Check module metadata without writing and verify downloads"
run = ["go mod tidy -diff", "go mod verify"]

[tasks."check:windows"]
description = "Cross-compile and vet every package for Windows"
# Inline env keeps GOOS away from mise's own tool installs (go install cannot cross-compile).
run = [
  "GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...",
  "GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...",
]

[tasks."check:workflows"]
description = "Lint and audit GitHub Actions workflows (zizmor adds online audits when GH_TOKEN is set)"
run = ["actionlint", "zizmor .github/workflows"]

[tasks."check:dependencies"]
description = "Scan all module versions, including unreachable dependencies"
run = "osv-scanner scan source --lockfile=go.mod"

[tasks."manifest:api:update"]
description = "Record the reviewed public manifest API baseline"
run = "apidiff -w docs/api/manifest.export github.com/TomaszJanusz/kitbag/pkg/manifest"

[tasks."manifest:golden"]
description = "Update reviewed manifest diagnostic golden files"
run = "go test ./internal/schemacheck -run '^TestManifest(SchemaParity|RuntimeGoldens|SourceGoldens)$' -args -update"

[tasks."docs:cli"]
description = "Regenerate the Cobra command reference in docs/cli"
run = "KITBAG_UPDATE_CLI=1 go test ./cmd/kitbag -run '^TestCLIReference$' -count=1"

[tasks."docs:cli:check"]
description = "Check the committed command reference without writing"
run = "go test ./cmd/kitbag -run '^TestCLIReference$' -count=1"

[tasks."docs:config"]
description = "Generate machine settings documentation from the key registry"
run = "KITBAG_UPDATE_CONFIG=1 go test ./cmd/kitbag -run '^TestConfigDocumentation$' -count=1"

[tasks."docs:config:check"]
description = "Check machine settings documentation freshness"
run = "go test ./cmd/kitbag -run '^TestConfigDocumentation$' -count=1"

[tasks."docs:api"]
description = "Generate the local API reference and contract tests from the schema"
run = "KITBAG_UPDATE_API=1 go test ./cmd/kitbag -run '^TestAPIArtifacts$' -count=1"

[tasks."docs:api:check"]
description = "Check API reference and generated contract-test freshness"
run = "go test ./cmd/kitbag -run '^TestAPIArtifacts$' -count=1"

[tasks."docs:links:check"]
description = "Check relative documentation files and heading anchors offline"
# The pinned Go toolchain runs this test package in the full check suite.
run = "go test ./internal/doccheck -count=1"

[tasks."release:snapshot"]
description = "Build release archives and SBOMs without signing or publishing; verify reproducibility"
run = "bash scripts/release-snapshot.sh"
