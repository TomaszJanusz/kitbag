[tools]
"core:go" = "1.27.3"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:mvdan/gofumpt" = "0.12.0"
"aqua:goreleaser/goreleaser" = "2.19.0"
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:sigstore/cosign" = "3.1.4"
"aqua:anchore/syft" = "1.55.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:mvdan/sh" = "3.14.1"
"aqua:crate-ci/typos" = "1.51.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"go:github.com/daixiang0/gci" = "0.14.0"
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:golang.org/x/exp/cmd/apidiff" = "v0.0.0-20261014143641-f0251eb4aa3e" # Public module version; gitleaks:allow
"go:github.com/vladopajic/go-test-coverage/v2" = "2.20.1"

[env]
GOTOOLCHAIN = "local"
GOMAXPROCS = "2"
GOFLAGS = "-p=2"

[tasks.format]
description = "Format all Go sources"
run = "bash scripts/quality.sh format"

[tasks."format:check"]
description = "Check all Go source formatting without writing"
run = "bash scripts/quality.sh format-check"

[tasks.lint]
description = "Validate configuration and lint all packages"
run = "golangci-lint config verify && golangci-lint run ./..."

[tasks.check]
description = "Run the complete local quality gate (read-only)"
run = [
  "bash scripts/quality.sh format-check",
  "golangci-lint config verify",
  "golangci-lint run ./...",
  "go vet ./...",
  "go test -race -shuffle=on -count=1 ./...",
  "govulncheck ./...",
  "typos",
]

[tasks."hooks:install"]
description = "Install the repository's pre-commit hook"
run = "lefthook install"
