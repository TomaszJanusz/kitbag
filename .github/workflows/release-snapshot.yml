name: Release snapshot

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release*.yml
      - release-please-*
      - .release-please-*
      - mise.toml
      - scripts/release-*.sh
      - packaging/**
      - cmd/kitbag/**
      - go.mod
      - go.sum
  push:
    branches: [main]

permissions: {}
concurrency:
  group: release-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.17
          cache: false
      - name: Package, validate and rebuild all four executables
        run: mise run release:snapshot
