name: Release snapshot

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release*.yml
      - release-please-*
      - .release-please-*
      - mise.toml
      - install.sh
      - scripts/release-*.sh
      - scripts/package-check.sh
      - scripts/homebrew-formula.sh
      - packaging/**
      - cmd/kitbag/**
      - go.mod
      - go.sum
  push:
    branches: [main]

permissions: {}
concurrency:
  group: release-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.11.8
          cache: false
      - name: Package, validate and rebuild all four executables
        run: mise run release:snapshot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-payload
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/kitbag-update.json
            dist/install.sh
            dist/aur/

  # Install the snapshot through each channel on fresh hosts. Images are pinned
  # by multi-architecture index digest; update the digests deliberately.
  ubuntu:
    name: ubuntu (${{ matrix.runner }})
    needs: snapshot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    container:
      image: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    steps:
      - name: Install the installer's prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-payload
          path: dist
      - name: Install the .deb package
        run: bash scripts/package-check.sh deb dist
      - name: Install with install.sh
        run: bash scripts/package-check.sh install-script dist

  fedora:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
    steps:
      - name: Install checkout prerequisites
        run: dnf install -y tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-payload
          path: dist
      - name: Install the .rpm package
        run: bash scripts/package-check.sh rpm dist

  arch:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    steps:
      - name: Install makepkg prerequisites
        run: pacman -Syu --noconfirm --needed base-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-payload
          path: dist
      - name: Build and install the AUR PKGBUILD
        run: bash scripts/package-check.sh aur dist

  macos:
    needs: snapshot
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-payload
          path: dist
      - name: Install with install.sh
        run: bash scripts/package-check.sh install-script dist
      - name: Install the Homebrew formula from a local tap
        run: bash scripts/package-check.sh homebrew dist
