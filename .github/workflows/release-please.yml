name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Main pushes only finalize explicitly approved, merged release PRs.
          # A maintainer dispatch is required to create/update a proposal.
          skip-github-pull-request: ${{ github.event_name != 'workflow_dispatch' }}
          skip-github-release: ${{ github.event_name == 'workflow_dispatch' }}

  release:
    needs: propose
    if: needs.propose.outputs.created == 'true'
    # Cover all release.yml jobs and its nested SLSA workflow, even skipped jobs.
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] pinned actionlint does not support dollar self-repository syntax
    with:
      tag: ${{ needs.propose.outputs.tag }}
      sha: ${{ needs.propose.outputs.sha }}
    # Explicit, optional channel credentials (never secrets: inherit).
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
