name: Nightly prerelease

# Deliberately no schedule. The maintainer enables it in a reviewed change.
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    # Cover all release.yml jobs and its nested SLSA workflow, even skipped jobs.
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] pinned actionlint does not support dollar self-repository syntax
    with:
      nightly: true
      tag: nightly
      sha: ${{ github.sha }}
