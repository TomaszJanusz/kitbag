name: ci
# Stable checks: check (ubuntu-latest), check (macos-latest), windows, modules, security, ci-success.
# Use ci-success for branch protection: it requires every job, including both matrix entries.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          cache: false
      - run: mise run check
      - name: Core coverage (85% once core has code)
        run: mise run coverage

  windows:
    name: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          cache: false
      - run: mise run check:windows

  modules:
    name: modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          cache: false
      - run: mise run check:modules

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the secret scan can walk every commit introduced by the PR.
          fetch-depth: 0
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          cache: false
      # Run on every PR so changes to tool pins and lint configuration are audited too.
      # The token enables zizmor's online audits (impostor commits, vulnerable actions).
      - run: mise run check:workflows
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Scan commits for secrets
        env:
          # PRs scan their own commits; pushes to main scan the whole history of HEAD.
          # Never gitleaks' default --all: unrelated branches must not fail this run.
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..HEAD', github.event.pull_request.base.sha) || '--full-history HEAD' }}
        run: mise exec -- gitleaks git --redact --no-banner --log-opts="$LOG_OPTS"
      - run: mise run check:dependencies

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [check, windows, modules, security]
    if: ${{ always() }}
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success")'
