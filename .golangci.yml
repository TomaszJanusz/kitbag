version: "2"

run:
  # Bound resource use on the shared runner; fail rather than hang indefinitely.
  concurrency: 2
  timeout: 5m
  # A check must never repair or update module metadata.
  modules-download-mode: readonly

linters:
  # An explicit set keeps upgrades reviewable; no implicit/default exclusions.
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - gocritic
    - exhaustive
    - nilnil
    - errorlint
    - forbidigo
    - depguard
    - gochecknoglobals
    - gochecknoinits
    - cyclop
    - funlen
    - nestif
    - unparam
    - prealloc
    - copyloopvar
    - intrange
    - perfsprint
    - mnd
    - misspell
    - godot
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - nolintlint
    - ineffassign
    - unused
  settings:
    errcheck:
      # Include fmt/io helpers, blank assignments and type assertions: no lost errors.
      disable-default-exclusions: true
      check-blank: true
      check-type-assertions: true
    govet:
      # Include shadow and every other available analyzer, beyond vet's defaults.
      enable-all: true
    exhaustive:
      # Enum-keyed maps need the same completeness guarantees as switches.
      check: [switch, mapliteral]
    forbidigo:
      # Canonical package identities catch aliased and dot-imported functions.
      analyze-types: true
      # Examples must respect the same architectural rules as other source.
      exclude-godoc-examples: false
      forbid:
        - pattern: '^ssh\.InsecureIgnoreHostKey$'
          pkg: '^golang.org/x/crypto/ssh$'
          msg: SSH host verification must never be bypassed.
        - pattern: '^fmt\.Print.*$'
          pkg: '^fmt$'
          msg: Console output belongs in cmd/.
        # Forbidigo matches identifiers, not arguments. Route ALL environment
        # reads through platform so HOME (including computed keys) cannot bypass
        # it; the os user directories would also pick macOS Library paths.
        - pattern: '^os\.(Getenv|LookupEnv|Environ|ExpandEnv|UserHomeDir|UserConfigDir|UserCacheDir)$'
          pkg: '^os$'
          msg: Environment and home discovery belong in internal/platform.
    depguard:
      # Strict allow-lists admit stdlib + this module only. New external
      # dependencies require an explicit review here; x/sys is platform-only.
      # Anchored module prefixes avoid accidentally allowing similarly named modules.
      rules:
        common:
          list-mode: strict
          allow:
            - $gostd
            # KIT-30: OS file notifications, confined to platform/watch below.
            - github.com/fsnotify/fsnotify$
            - github.com/TomaszJanusz/kitbag/
            - golang.org/x/sys/
            # KIT-22: Go Git operations and SSH agent authentication, confined below.
            - github.com/go-git/go-git/v5/
            - github.com/go-git/go-git/v5$
            # KIT-32: ssh_config parsing, signing and known_hosts verification
            # (skeema adds host key algorithm selection); confined to embedded below.
            - github.com/kevinburke/ssh_config$
            - github.com/skeema/knownhosts$
            - golang.org/x/crypto/ssh$
            - golang.org/x/crypto/ssh/knownhosts$
            - golang.org/x/crypto/ssh/agent$
            # Schema-gate test dependencies; the schema-check rule confines them.
            - github.com/BurntSushi/toml$
            # KIT-12: positioned TOML parsing is confined to pkg/manifest.
            - github.com/pelletier/go-toml/v2$
            # KIT-26: terminal forms and model tests, confined to cmd/kitbag.
            - github.com/charmbracelet/huh$
            - github.com/charmbracelet/bubbletea$
            # KIT-23: Cobra command tree and test-only Markdown reference generation.
            - github.com/spf13/cobra$
            - github.com/spf13/cobra/doc$
            - github.com/pelletier/go-toml/v2/unstable$
            - github.com/santhosh-tekuri/jsonschema/v6$
            # KIT-72: reuse the pinned Markdown parser for offline docs tests.
            - github.com/russross/blackfriday/v2$
            # Test-only: the end-to-end harness (see test-only below).
            - github.com/rogpeppe/go-internal/testscript$
        daemon-watcher:
          files: ["$all", "!**/internal/platform/watch/*.go"]
          deny:
            - pkg: github.com/fsnotify/fsnotify
              desc: OS notifications belong in internal/platform/watch.
        embedded-git:
          files: ["$all", "!**/internal/vcs/embedded/*.go", "!**/internal/vcs/embedded/**/*.go"]
          deny:
            - pkg: github.com/go-git/go-git/v5
              desc: go-git belongs only in internal/vcs/embedded; system uses its shared tree renderer.
            - pkg: github.com/kevinburke/ssh_config
              desc: SSH configuration belongs in the embedded Git backend.
            - pkg: github.com/skeema/knownhosts
              desc: SSH host verification belongs in the embedded Git backend.
            - pkg: golang.org/x/crypto/ssh
              desc: SSH agent authentication belongs in the embedded Git backend.
        cli-cobra:
          # Cobra belongs to the binary; core policy remains renderer-independent.
          files: ["$all", "!**/cmd/kitbag/*.go"]
          deny:
            - pkg: github.com/spf13/cobra
              desc: Cobra belongs in cmd/kitbag.
        cli-forms:
          # ADR 5: huh is a replaceable renderer; policy stays in core.
          files: ["$all", "!**/cmd/kitbag/*.go"]
          deny:
            - pkg: github.com/charmbracelet/huh
              desc: Terminal forms belong in cmd/kitbag.
            - pkg: github.com/charmbracelet/bubbletea
              desc: Bubble Tea messages belong to CLI form model tests.
        cli-docs:
          files: ["$all", "!**/cmd/kitbag/docs_test.go"]
          deny:
            - pkg: github.com/spf13/cobra/doc
              desc: Command-reference generation is test-only.
        docs-parser:
          files: ["$all", "!**/internal/doccheck/*_test.go"]
          deny:
            - pkg: github.com/russross/blackfriday/v2
              desc: Markdown link parsing is test-only in internal/doccheck.
        schema-check:
          # The oracle is test-only, including validation of real CLI JSON in testscript.
          files: ["$all", "!**/internal/schemacheck/*_test.go", "!**/cmd/kitbag/schema_test.go", "!**/cmd/kitbag/api_contract_test.go"]
          deny:
            - pkg: github.com/BurntSushi/toml
              desc: TOML decoding is a test-only dependency of internal/schemacheck.
            - pkg: github.com/santhosh-tekuri/jsonschema/v6
              desc: JSON Schema validation is a test-only dependency of internal/schemacheck.
        manifest-toml:
          files: ["$all", "!**/pkg/manifest/*.go", "!**/internal/config/*.go"]
          deny:
            - pkg: github.com/pelletier/go-toml/v2
              desc: TOML parsing belongs in pkg/manifest or internal/config.
        manifest-host:
          # Public parsing code and its tests use injected platform contracts.
          files: ["**/pkg/manifest/*.go", "**/pkg/manifest/**/*.go"]
          deny:
            - pkg: os
              desc: Manifest validation reaches the host through platform interfaces.
            - pkg: io/ioutil
              desc: Manifest validation reaches the host through platform interfaces.
        test-only:
          # testscript and the harness built on it must never reach production
          # builds: only _test.go files and internal/e2e itself may import them.
          files: ["$all", "!$test", "!**/internal/e2e/*.go"]
          deny:
            - pkg: github.com/rogpeppe/go-internal/
              desc: testscript is test-only; use it from _test.go files.
            - pkg: github.com/TomaszJanusz/kitbag/internal/e2e
              desc: The end-to-end harness is test-only; import it from _test.go files.
        outside-platform:
          # Negated file globs restrict OS primitives everywhere except platform.
          files: ["$all", "!**/internal/platform/*.go", "!**/internal/platform/**/*.go"]
          deny:
            - pkg: syscall
              desc: OS primitives belong in internal/platform.
            - pkg: golang.org/x/sys/
              desc: OS primitives belong in internal/platform.
        process-execution:
          # A child process inherits kitbag's whole environment (GIT_DIR, ...)
          # unless Cmd.Env is set. Only the platform layer and the system Git
          # backend, whose runner builds an explicit environment, start
          # processes; tests may run fixtures directly.
          files:
            - "$all"
            - "!$test"
            - "!**/internal/platform/*.go"
            - "!**/internal/platform/**/*.go"
            - "!**/internal/vcs/system/*.go"
          deny:
            - pkg: os/exec
              desc: Start processes through internal/platform or the vcs/system runner.
        release-network:
          # KIT-30/31: bounded release metadata and asset requests share one transport.
          files: ["$all", "!$test", "!**/internal/releasehttp/*.go"]
          deny:
            - pkg: net/http
              desc: Release HTTP belongs only in internal/releasehttp.
        release-signature:
          # KIT-31: standard-library cosign ECDSA verification has no external dependency.
          files: ["$all", "!$test", "!**/internal/releasesig/*.go"]
          deny:
            - pkg: crypto/ecdsa
              desc: Release signature verification belongs only in internal/releasesig.
        core:
          # The policy layer must not depend on command or UI renderers/models,
          # nor reach the host except through the platform interfaces. Denying
          # os (and os/...) keeps core and its tests off the real filesystem.
          files: ["**/internal/core/*.go", "**/internal/core/**/*.go"]
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/cmd/
              desc: Commands orchestrate core, never the reverse.
            - pkg: github.com/TomaszJanusz/kitbag/internal/ui/
              desc: Core is independent of UI.
            - pkg: os
              desc: Core reaches the host only through internal/platform; use io/fs for types.
            - pkg: io/ioutil
              desc: Core reaches the host only through internal/platform.
        ui-model:
          # KIT-51/ADR 5: view models are pure state machines shared by every
          # renderer. No UI toolkit, host access, process, network or transport;
          # data arrives through model.Client (adapter: internal/ui/apiclient).
          files: ["**/internal/ui/model/*.go", "**/internal/ui/model/**/*.go"]
          deny:
            - pkg: github.com/charmbracelet/
              desc: Terminal toolkits belong in renderers, not shared view models.
            - pkg: fyne.io/
              desc: Window toolkits belong in renderers, not shared view models.
            - pkg: gioui.org/
              desc: Window toolkits belong in renderers, not shared view models.
            - pkg: github.com/gdamore/
              desc: Terminal toolkits belong in renderers, not shared view models.
            - pkg: github.com/rivo/
              desc: Terminal toolkits belong in renderers, not shared view models.
            - pkg: os
              desc: View models never reach the host; renderers and adapters do.
            - pkg: io/ioutil
              desc: View models never reach the host; renderers and adapters do.
            - pkg: net
              desc: View models never use the network; internal/ui/apiclient does.
            - pkg: syscall
              desc: View models never reach the host.
            - pkg: github.com/TomaszJanusz/kitbag/internal/api
              desc: Use model.Client; the API adapter lives in internal/ui/apiclient.
            - pkg: github.com/TomaszJanusz/kitbag/internal/core/
              desc: Use model.Client; core types stay behind internal/ui/apiclient.
            - pkg: github.com/TomaszJanusz/kitbag/internal/platform
              desc: View models never reach the host.
            - pkg: github.com/TomaszJanusz/kitbag/cmd/
              desc: Commands render models, never the reverse.
        platform-implementations:
          # Only the binary wires a real host; everything else, tests included,
          # accepts the platform interfaces (tests use the in-memory fake).
          files:
            - "$all"
            - "!**/cmd/*.go"
            - "!**/cmd/**/*.go"
            - "!**/internal/platform/*.go"
            - "!**/internal/platform/**/*.go"
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/platform/unix
              desc: Accept platform interfaces; only cmd/kitbag constructs a real host.
            - pkg: github.com/TomaszJanusz/kitbag/internal/platform/windows
              desc: Accept platform interfaces; only cmd/kitbag constructs a real host.
        platform-fake:
          # The in-memory host must never be wired into production code.
          files:
            - "$all"
            - "!$test"
            - "!**/internal/platform/*.go"
            - "!**/internal/platform/**/*.go"
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/platform/fake
              desc: The in-memory platform is for tests only.
        claude:
          # Allow shared adapter contracts and this agent's subtree, never peers.
          files: ["**/internal/adapters/claude/*.go", "**/internal/adapters/claude/**/*.go"]
          # Lax: common already restricts imports to stdlib and this module.
          # depguard compares an import with its nearest sorted entry only, so
          # a strict list here let the subtree entries hide kitbag/ (KIT-17).
          list-mode: lax
          allow:
            - github.com/TomaszJanusz/kitbag/internal/adapters/claude/
            - github.com/TomaszJanusz/kitbag/internal/adapters/claude$
            - github.com/TomaszJanusz/kitbag/internal/adapters$
            # The shared instruction renderer is a contract, not a peer agent.
            - github.com/TomaszJanusz/kitbag/internal/adapters/instructions$
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/adapters/
              desc: Adapters cannot import other agents.
        codex:
          # Longest-prefix matching admits only codex below the adapters prefix.
          files: ["**/internal/adapters/codex/*.go", "**/internal/adapters/codex/**/*.go"]
          # Lax: common already restricts imports to stdlib and this module.
          # depguard compares an import with its nearest sorted entry only, so
          # a strict list here let the subtree entries hide kitbag/ (KIT-17).
          list-mode: lax
          allow:
            - github.com/TomaszJanusz/kitbag/internal/adapters/codex/
            - github.com/TomaszJanusz/kitbag/internal/adapters/codex$
            - github.com/TomaszJanusz/kitbag/internal/adapters$
            # The shared instruction renderer is a contract, not a peer agent.
            - github.com/TomaszJanusz/kitbag/internal/adapters/instructions$
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/adapters/
              desc: Adapters cannot import other agents.
        gemini:
          # Longest-prefix matching admits only gemini below the adapters prefix.
          files: ["**/internal/adapters/gemini/*.go", "**/internal/adapters/gemini/**/*.go"]
          # Lax: common already restricts imports to stdlib and this module.
          # depguard compares an import with its nearest sorted entry only, so
          # a strict list here let the subtree entries hide kitbag/ (KIT-17).
          list-mode: lax
          allow:
            - github.com/TomaszJanusz/kitbag/internal/adapters/gemini/
            - github.com/TomaszJanusz/kitbag/internal/adapters/gemini$
            - github.com/TomaszJanusz/kitbag/internal/adapters$
            # The shared instruction renderer is a contract, not a peer agent.
            - github.com/TomaszJanusz/kitbag/internal/adapters/instructions$
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/adapters/
              desc: Adapters cannot import other agents.
        opencode:
          # Longest-prefix matching admits only opencode below the adapters prefix.
          files: ["**/internal/adapters/opencode/*.go", "**/internal/adapters/opencode/**/*.go"]
          # Lax: common already restricts imports to stdlib and this module.
          # depguard compares an import with its nearest sorted entry only, so
          # a strict list here let the subtree entries hide kitbag/ (KIT-17).
          list-mode: lax
          allow:
            - github.com/TomaszJanusz/kitbag/internal/adapters/opencode/
            - github.com/TomaszJanusz/kitbag/internal/adapters/opencode$
            - github.com/TomaszJanusz/kitbag/internal/adapters$
            # The shared instruction renderer is a contract, not a peer agent.
            - github.com/TomaszJanusz/kitbag/internal/adapters/instructions$
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/adapters/
              desc: Adapters cannot import other agents.
        generic:
          # Apply the same self-only import boundary to the generic adapter.
          files: ["**/internal/adapters/generic/*.go", "**/internal/adapters/generic/**/*.go"]
          # Lax: common already restricts imports to stdlib and this module.
          # depguard compares an import with its nearest sorted entry only, so
          # a strict list here let the subtree entries hide kitbag/ (KIT-17).
          list-mode: lax
          allow:
            - github.com/TomaszJanusz/kitbag/internal/adapters/generic/
            - github.com/TomaszJanusz/kitbag/internal/adapters/generic$
            - github.com/TomaszJanusz/kitbag/internal/adapters$
            # The shared instruction renderer is a contract, not a peer agent.
            - github.com/TomaszJanusz/kitbag/internal/adapters/instructions$
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/adapters/
              desc: Adapters cannot import other agents.
        files:
          # Non-agent declarations share target contracts, never peer adapters.
          files: ["**/internal/adapters/files/*.go", "**/internal/adapters/files/**/*.go"]
          list-mode: lax
          allow:
            - github.com/TomaszJanusz/kitbag/internal/adapters/files/
            - github.com/TomaszJanusz/kitbag/internal/adapters/files$
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/adapters/
              desc: File declarations cannot import agent adapters.
        instructions:
          # KIT-17: the shared instruction renderer serves every adapter, so it
          # never depends on one; same lax shape as the agent rules above.
          files: ["**/internal/adapters/instructions/*.go", "**/internal/adapters/instructions/**/*.go"]
          list-mode: lax
          allow:
            - github.com/TomaszJanusz/kitbag/internal/adapters/instructions/
            - github.com/TomaszJanusz/kitbag/internal/adapters/instructions$
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/adapters/
              desc: The shared instruction renderer cannot import adapters.
        unregistered-adapters:
          # Fail closed for a new agent until it has its own self-only rule.
          files:
            - "**/internal/adapters/*.go"
            - "**/internal/adapters/**/*.go"
            - "!**/internal/adapters/claude/*.go"
            - "!**/internal/adapters/claude/**/*.go"
            - "!**/internal/adapters/gemini/*.go"
            - "!**/internal/adapters/gemini/**/*.go"
            - "!**/internal/adapters/opencode/*.go"
            - "!**/internal/adapters/opencode/**/*.go"
            - "!**/internal/adapters/codex/*.go"
            - "!**/internal/adapters/codex/**/*.go"
            - "!**/internal/adapters/generic/*.go"
            - "!**/internal/adapters/generic/**/*.go"
            - "!**/internal/adapters/files/*.go"
            - "!**/internal/adapters/files/**/*.go"
            - "!**/internal/adapters/instructions/*.go"
            - "!**/internal/adapters/instructions/**/*.go"
          deny:
            - pkg: github.com/TomaszJanusz/kitbag/internal/adapters/
              desc: Register the adapter's self-only import rule first.
    revive:
      # Keep idiomatic defaults when customizing exported/package documentation.
      enable-default-rules: true
      rules:
        - name: exported
          # Document exported methods even when their receiver is private.
          arguments: [checkPrivateReceivers]
        - name: package-comments
    cyclop:
      # Keep each function within ten independent paths (including tests).
      max-complexity: 10
    funlen:
      # Keep review units small; both line and statement ceilings apply to tests too.
      lines: 60
      statements: 40
    nestif:
      # Flag nesting once its cumulative complexity reaches four.
      min-complexity: 4
    nolintlint:
      # Suppressions must name the linter and explain why; unused ones still fail.
      require-specific: true
      require-explanation: true
  exclusions:
    # Generated code is still project source and must satisfy the gate.
    generated: disable
    rules:
      # These are architectural permissions, not baselines: permit only the
      # relevant forbidigo diagnostic in its designated layer.
      - path: ^cmd/
        linters: [forbidigo]
        text: Console output belongs in cmd/
      - path: ^internal/platform/
        linters: [forbidigo]
        text: Environment and home discovery belong in internal/platform
      # The test-only end-to-end harness must read HOME to refuse running
      # against the real home directory; depguard's test-only rule keeps it
      # out of production code, where the forbidigo rule stays intact.
      - path: ^internal/e2e/
        linters: [forbidigo]
        text: Environment and home discovery belong in internal/platform

formatters:
  # Mirror scripts/quality.sh for editor integrations; the gate and hooks use
  # standalone mise-pinned versions rather than golangci-lint's embedded versions.
  enable: [gofumpt, gci]
  settings:
    gci:
      # Separate stdlib, third-party and KitBag imports deterministically.
      sections: [standard, default, prefix(github.com/TomaszJanusz/kitbag/)]
  exclusions:
    # Format generated and build-tagged files when explicitly passed by quality.sh.
    generated: disable

issues:
  # Show every violation and every responsible linter for useful negative controls.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
